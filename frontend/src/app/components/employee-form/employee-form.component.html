<div class="form-page">
  <div class="back-row">
    <a routerLink="/" class="btn btn-ghost btn-sm">← Back to list</a>
  </div>

  <div class="card form-card">
    <h2>{{ isEditMode ? 'Edit Employee' : 'Add Employee' }}</h2>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>
    <div *ngIf="loading" class="state">Loading…</div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" formControlName="name" placeholder="e.g. Aarav Sharma" />
        <div class="field-error" *ngIf="f['name'].touched && f['name'].invalid">
          Name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="e.g. aarav@example.com" />
        <div class="field-error" *ngIf="f['email'].touched && f['email'].invalid">
          <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
          <span *ngIf="f['email'].errors?.['email']">Enter a valid email address.</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="department">Department</label>
          <input id="department" type="text" formControlName="department" placeholder="e.g. Engineering" />
          <div class="field-error" *ngIf="f['department'].touched && f['department'].invalid">
            Department is required.
          </div>
        </div>

        <div class="form-group">
          <label for="designation">Designation</label>
          <input id="designation" type="text" formControlName="designation" placeholder="e.g. Software Engineer" />
          <div class="field-error" *ngIf="f['designation'].touched && f['designation'].invalid">
            Designation is required.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="salary">Salary</label>
        <input id="salary" type="number" formControlName="salary" placeholder="e.g. 72000" min="0" />
        <div class="field-error" *ngIf="f['salary'].touched && f['salary'].invalid">
          Enter a valid, non-negative salary.
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          {{ submitting ? 'Saving…' : (isEditMode ? 'Update Employee' : 'Save Employee') }}
        </button>
      </div>
    </form>
  </div>
</div>
