version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: ems-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: employee_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ems-network

  # Node.js + Express REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend-api
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: employee_db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ems-network

  # Angular 12 Frontend Application (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems-frontend-ui
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - ems-network

volumes:
  mysql_data:
    driver: local

networks:
  ems-network:
    driver: bridge
